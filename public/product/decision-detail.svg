55H1280" stroke="#ece7e1"/><circle cx="1166" cy="29" r="12" fill="#e6e9dd"/><text x="1158" y="33" fill="#101623" font-size="9" font-weight="600">AK</text><circle cx="1186" cy="29" r="12" fill="#efe2d9"/><text x="1178" y="33" fill="#101623" font-size="9" font-weight="600">JL</text><rect x="1213" y="17" width="47" height="24" rx="5" fill="#fff" stroke="#ece7e1"/><text x="1225" y="33" fill="#646b76" font-size="10" font-weight="400">Share</text><text x="235" y="107" fill="#101623" font-size="25" font-weight="600">A clear next move.</text><text x="235" y="138" fill="#646b76" font-size="12" font-weight="400">DEC-014  /  Pricing flexibility</text><rect x="1108" y="85" width="133" height="25" rx="5" fill="#fbf1df"/><text x="1174.5" y="97.5" fill="#89682b" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">Awaiting approval</text><path d="M233 169H1245" stroke="#ece7e1"/><text x="244" y="214" fill="#b93f35" font-size="12" font-weight="600">Decision brief</text><text x="365" y="214" fill="#646b76" font-size="12" font-weight="400">Evidence · 4</text><text x="491" y="214" fill="#646b76" font-size="12" font-weight="400">Activity</text><text x="244" y="280" fill="#101623" font-size="29" font-weight="600">Validate flexible pricing</text><text x="244" y="316" fill="#646b76" font-size="13" font-weight="400">Explore the need before committing engineering time.</text><text x="244" y="339" fill="#646b76" font-size="13" font-weight="400">Keep the roadmap steady while we resolve the unknowns.</text><text x="244" y="396" fill="#101623" font-size="14" font-weight="600">Why this direction</text><text x="244" y="428" fill="#646b76" font-size="13" font-weight="400">The market change is real and customers mention the same problem.</text><text x="244" y="451" fill="#646b76" font-size="13" font-weight="400">That is a reason to investigate, but not yet a reason to build.</text><text x="244" y="508" fill="#101623" font-size="14" font-weight="600">What we need to learn</text><rect x="245" y="532" width="15" height="15" rx="3" fill="white" stroke="#d4d8df"/><text x="275" y="544" fill="#101623" font-size="12" font-weight="400">Interview 5 customers about pricing constraints</text><rect x="245" y="573" width="15" height="15" rx="3" fill="white" stroke="#d4d8df"/><text x="275" y="585" fill="#101623" font-size="12" font-weight="400">Test willingness to pay for a flexible plan</text><rect x="245" y="614" width="15" height="15" rx="3" fill="white" stroke="#d4d8df"/><text x="275" y="626" fill="#101623" font-size="12" font-weight="400">Review overlap with the current packaging roadmap</text><path d="M244 674H831" stroke="#ece7e1"/><circle cx="258" cy="707" r="12" fill="#e6e9dd"/><text x="250" y="711" fill="#101623" font-size="9" font-weight="600">AK</text><text x="280" y="705" fill="#101623" font-size="11" font-weight="550">Alex Kim</text><text x="280" y="723" fill="#646b76" font-size="10" font-weight="400">Decision owner</text><rect x="899" y="204" width="347" height="514" rx="8" fill="#f8f9fb"/><text x="924" y="240" fill="#101623" font-size="13" font-weight="600">Compare the options</text><rect x="918" y="261" width="310" height="77" rx="6" fill="#fff0ec" stroke="#dbe1fb"/><circle cx="938" cy="286" r="5" fill="#b93f35"/><text x="954" y="290" fill="#b93f35" font-size="13" font-weight="550">Validate</text><text x="936" y="315" fill="#646b76" font-size="11" font-weight="400">Resolve the evidence gaps</text><rect x="918" y="352" width="310" height="77" rx="6" fill="#fff" stroke="#ece7e1"/><circle cx="938" cy="377" r="5" fill="#d5d8df"/><text x="954" y="381" fill="#101623" font-size="13" font-weight="550">Watch</text><text x="936" y="406" fill="#646b76" font-size="11" font-weight="400">Revisit when the signal changes</text><rect x="918" y="443" width="310" height="77" rx="6" fill="#fff" stroke="#ece7e1"/><circle cx="938" cy="468" r="5" fill="#d5d8df"/><text x="954" y="472" fill="#101623" font-size="13" font-weight="550">Ignore for now</text><text x="936" y="497" fill="#646b76" font-size="11" font-weight="400">Keep the reason in decision memory</text><path d="M923 561H1223" stroke="#ece7e1"/><g transform="translate(924 582)" fill="none" stroke="#28785c" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l3 3 7-7"/></g><text x="948" y="594" fill="#101623" font-size="12" font-weight="550">Your team makes the call.</text><text x="924" y="618" fill="#646b76" font-size="11" font-weight="400">No roadmap changes or external work</text><text x="924" y="636" fill="#646b76" font-size="11" font-weight="400">without a person approving the direction.</text><rect x="920" y="665" width="306" height="34" rx="5" fill="#101623"/><text x="993" y="687" fill="#fff" font-size="11" font-weight="550">Approve validation plan</text></g></svg>