t-weight="400">/</text><text x="316" y="34" fill="#101623" font-size="11" font-weight="500">Evidence review</text><path d="M196 55H1280" stroke="#ece7e1"/><circle cx="1166" cy="29" r="12" fill="#e6e9dd"/><text x="1158" y="33" fill="#101623" font-size="9" font-weight="600">AK</text><circle cx="1186" cy="29" r="12" fill="#efe2d9"/><text x="1178" y="33" fill="#101623" font-size="9" font-weight="600">JL</text><rect x="1213" y="17" width="47" height="24" rx="5" fill="#fff" stroke="#ece7e1"/><text x="1225" y="33" fill="#646b76" font-size="10" font-weight="400">Share</text><text x="235" y="107" fill="#101623" font-size="25" font-weight="600">Follow the signal. See the source.</text><text x="235" y="137" fill="#646b76" font-size="12" font-weight="400">Pricing flexibility  /  Evidence review</text><rect x="1070" y="86" width="165" height="25" rx="5" fill="#eaf4ef"/><text x="1152.5" y="98.5" fill="#28785c" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">4 sources cross-checked</text><text x="235" y="193" fill="#b93f35" font-size="12" font-weight="600">Evidence</text><text x="334" y="193" fill="#646b76" font-size="12" font-weight="400">Customer context</text><text x="481" y="193" fill="#646b76" font-size="12" font-weight="400">Open questions</text><path d="M234 210H1244" stroke="#ece7e1"/><rect x="233" y="239" width="635" height="216" rx="8" fill="#fff" stroke="#ece7e1"/><rect x="254" y="257" width="102" height="25" rx="5" fill="#f2f3f5"/><text x="305.0" y="269.5" fill="#646b76" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">Primary source</text><text x="254" y="311" fill="#101623" font-size="18" font-weight="550">A pricing change, in the original words.</text><rect x="254" y="332" width="592" height="49" rx="3" fill="#f3f5fd"/><text x="268" y="362" fill="#101623" font-size="15" font-weight="500">“Pay for what you use, with no annual commitment.”</text><text x="254" y="416" fill="#646b76" font-size="11" font-weight="400">Competitor pricing page</text><text x="702" y="416" fill="#646b76" font-size="10" font-weight="400">Captured Sep 4</text><rect x="233" y="474" width="635" height="205" rx="8" fill="#fff" stroke="#ece7e1"/><rect x="254" y="492" width="112" height="25" rx="5" fill="#f2f3f5"/><text x="310.0" y="504.5" fill="#646b76" font-size="11" font-weight="500" text-anchor="middle" dominant-baseline="central">Customer context</text><text x="254" y="547" fill="#101623" font-size="18" font-weight="550">The same need, from your customers.</text><text x="254" y="580" fill="#101623" font-size="14" font-weight="400">“We need room to scale down in quieter months.</text><text x="254" y="604" fill="#101623" font-size="14" font-weight="400">A fixed plan makes it hard to get this approved.”</text><circle cx="268" cy="648" r="12" fill="#efe2d9"/><text x="260" y="652" fill="#101623" font-size="9" font-weight="600">JL</text><text x="290" y="647" fill="#646b76" font-size="11" font-weight="400">Customer discovery call</text><text x="708" y="649" fill="#646b76" font-size="10" font-weight="400">Source 2 of 4</text><rect x="900" y="239" width="344" height="440" rx="8" fill="#f9fafc"/><g transform="translate(923 262)" fill="none" stroke="#b93f35" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M8 0l2 5 6 3-6 2-2 6-2-6-6-2 6-3z"/></g><text x="948" y="275" fill="#101623" font-size="13" font-weight="600">Evidence assessment</text><text x="923" y="322" fill="#101623" font-size="16" font-weight="550">The change is verified.</text><text x="923" y="346" fill="#101623" font-size="16" font-weight="550">The opportunity needs testing.</text><path d="M923 374H1220" stroke="#ece7e1"/><text x="923" y="407" fill="#28785c" font-size="10" font-weight="600">SUPPORTED</text><text x="923" y="435" fill="#646b76" font-size="12" font-weight="400">The pricing model has changed.</text><text x="923" y="457" fill="#646b76" font-size="12" font-weight="400">Flexibility appears in customer calls.</text><text x="923" y="508" fill="#806132" font-size="10" font-weight="600">STILL UNKNOWN</text><text x="923" y="536" fill="#646b76" font-size="12" font-weight="400">How many customers need this?</text><text x="923" y="559" fill="#646b76" font-size="12" font-weight="400">Would they pay for a different plan?</text><text x="923" y="582" fill="#646b76" font-size="12" font-weight="400">Does it fit our product strategy?</text><text x="923" y="642" fill="#b93f35" font-size="11" font-weight="500">Every claim keeps its citation.</text></g></svg>